[package]
name = "unhollowed-2"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "A local-first productivity workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "0.1"
# Already built for tauri-plugin-dialog. Used directly only to show a message
# when the app cannot start, before any window or plugin exists.
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-app-kit"] }

[dev-dependencies]
# The mock runtime for the update check tests. Test builds only.
tauri = { version = "2", features = ["test"] }
