name: Bug report
description: Report a reproducible problem in Unhollowed 2
labels: ["type:bug"]
body:
  - type: input
    id: environment
    attributes:
      label: App version, operating system, and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use sample data and omit personal information.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted logs or screenshots
