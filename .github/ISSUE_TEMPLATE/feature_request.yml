name: Feature request
description: Propose a change to the product
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User need
      description: Describe the workflow and where it breaks down today.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Dependencies, data compatibility, and offline behavior
