name: Desktop packaging

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package*.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".nvmrc"
      - "rust-toolchain.toml"
      - ".github/workflows/platform-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        options: [windows, macos, both]
        default: windows

permissions:
  contents: read

concurrency:
  group: desktop-packaging-${{ github.event_name }}-${{ github.run_id }}

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(
          ((github.event_name == 'push' && github.ref_type == 'branch') || inputs.platform == 'windows') && '["windows"]'
          || inputs.platform == 'macos' && '["macos"]'
          || '["windows","macos"]'
          ) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2025' || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build desktop packages with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: --ci --no-sign --bundles ${{ matrix.platform == 'windows' && 'nsis,msi' || 'app,dmg' }} -- --locked
          uploadUpdaterJson: false
      - name: Upload validation installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unhollowed-2-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/${{ matrix.platform == 'windows' && 'nsis/*.exe' || 'dmg/*.dmg' }}
            ${{ matrix.platform == 'windows' && 'src-tauri/target/release/bundle/msi/*.msi' || '' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
